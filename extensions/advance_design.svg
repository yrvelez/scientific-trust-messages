<g id="arm-c_peer" data-text="Student video &#x27;Why should we trust science?&#x27; on peer review and expert credentials.">
<rect class="arm" x="360" y="285" width="300" height="78" rx="6"/>
<text x="372" y="307">Peer review video</text>
<text class="cap" x="372" y="325">Student video &#x27;Why should we trust</text>
<text class="cap" x="372" y="340">science?&#x27; on peer review and expert</text>
</g>
<path class="edge" d="M318,202.5 L356,324.0"/>
<g>
<rect class="box" x="700" y="142.5" width="240" height="120" rx="6"/>
<text class="kicker" x="712" y="164.5">Primary outcome</text>
