<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 395" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Replicating the short student videos with a delayed follow-up and a behavioural outcome</title><desc id="fd-desc">Replicating the short student videos with a delayed follow-up and a behavioural outcome. 4 conditions: Control, Science through the day, Science in everyday life, Peer review video. Primary outcome: Immediate post-treatment trust in science (mean of 6 items, items 4-6 reverse-coded), with 7-day trust and the behavioural choice as secondary outcomes.. Population: US adults from an online panel such as Lucid, quota-matched to the adult population.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
@media (prefers-color-scheme: dark){:root{--fd-ink:#ecebe6;--fd-muted:#b4b1a9;--fd-rule:#4a4a52;--fd-accent:#e08a96;--fd-bg:#1d1d23}}
.box{fill:var(--fd-bg,#fff);stroke:var(--fd-ink,#1c1b19);stroke-width:1.2}
.arm{fill:var(--fd-bg,#fff);stroke:var(--fd-accent,#8b1e2d);stroke-width:1.4}
.soft{fill:var(--fd-bg,#fff);stroke:var(--fd-rule,#d9d5cc);stroke-width:1.2}
text{font-family:Inter,Helvetica,Arial,sans-serif;fill:var(--fd-ink,#1c1b19);font-size:14px}
.cap{font-size:12px;fill:var(--fd-muted,#8a877f)}
.kicker{font-size:11px;letter-spacing:.08em;fill:var(--fd-muted,#8a877f);text-transform:uppercase}
.edge{stroke:var(--fd-ink,#1c1b19);stroke-width:1.2;fill:none;marker-end:url(#fd-arrow)}
.assoc{stroke-dasharray:5 4}
#fd-arrow path{fill:var(--fd-ink,#1c1b19)}
</style>
<defs><marker id="fd-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z"/></marker></defs><text class="kicker" x="20" y="16">Proposed follow-up: Replicating the short student videos with a delayed follow-up and a behavioural outcome</text>
<g>
<rect class="box" x="20" y="172.5" width="200" height="60" rx="6"/>
<text class="kicker" x="32" y="194.5">Population</text>
<text x="32" y="212.5">US adults from an</text>
<text x="32" y="230.5">online panel such as</text>
<text x="32" y="248.5">Lucid, quota-matched</text>
<text x="32" y="266.5">to the adult</text>
</g>
<polygon class="box" points="280,178.5 316,202.5 280,226.5 244,202.5"/>
<path class="edge" d="M220,202.5 L242,202.5"/><text class="cap" x="231.0" y="196.5" text-anchor="middle">randomized</text>
<g id="arm-c_control" data-text="Sees only a page asking them to continue.">
<rect class="arm" x="360" y="30" width="300" height="63" rx="6"/>
<text x="372" y="52">Control</text>
<text class="cap" x="372" y="70">Sees only a page asking them to continue.</text>
</g>
<path class="edge" d="M318,202.5 L356,61.5"/>
<g id="arm-c_day" data-text="Student video on how people interact with science and technology over a day.">
<rect class="arm" x="360" y="105" width="300" height="78" rx="6"/>
<text x="372" y="127">Science through the day</text>
<text class="cap" x="372" y="145">Student video on how people interact with</text>
<text class="cap" x="372" y="160">science and technology over a day.</text>
</g>
<path class="edge" d="M318,202.5 L356,144.0"/>
