<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Does partisanship moderate the student-video effect?</title><desc id="fd-desc">Does partisanship moderate the student-video effect?. 2 conditions: Control, Science in everyday life video. Primary outcome: Trust in science: mean of the 6 post-treatment items, items 4-6 reverse-coded.. Population: US adults aged 18+ from Lucid and a second online panel, quota-sampled to about 50% Republican-leaning.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
