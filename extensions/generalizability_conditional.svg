<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 365" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Partisan and platform boundary of the video effects</title><desc id="fd-desc">Partisan and platform boundary of the video effects. 4 conditions: Control, Message 15 forced, Message 15 feed, Message 20 forced. Primary outcome: Trust in science: mean of 6 items, with items 4-6 reverse-coded (post_science_1 to post_science_6).. Population: US adult online panel, stratified by party identification (about half Republican-identifying).</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
