<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 485" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Proposed follow-up: Format versus content: separating persuasion from salience</title><desc id="fd-desc">Format versus content: separating persuasion from salience. 5 conditions: Control, Science video, Science text, Neutral video, Neutral text. Primary outcome: Post-treatment trust in science (mean of the 6 items, items 4-6 reverse-coded), adjusted for pre-trust.. Population: US adults recruited through an online panel, as in the source study.</desc><style>
:root{--fd-ink:#1c1b19;--fd-muted:#8a877f;--fd-rule:#d9d5cc;--fd-accent:#8b1e2d;--fd-bg:#ffffff}
