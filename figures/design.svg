<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 3056" width="100%" role="img" aria-labelledby="fd-title fd-desc"><title id="fd-title">Design: survey experiment</title><desc id="fd-desc">A survey experiment on online panel respondents in US (N = 8,572 analysed). Respondents are randomly assigned to 33 arms: Message 2 (video), Message 3 (education gap in confidence in science), Message 4 (what science is), Message 5 (video), Message 6 (image), Message 7 (achievements of scientific progress), Message 8 (video), Message 9 (video), Message 10 (video), Message 11 (news story on a COVID-19 death), Message 12 (video), Message 13 (image), Message 14 (news story on a global-warming study), Message 15 (video), Message 16 (video), Message 17 (why people question science), Message 18 (image), Message 19 (image), Message 20 (video), Message 21 (image), Message 22 (values exercise), Message 23 (image), Message 24 (image), Message 25 (video), Message 26 (video), Message 27 (image), Message 28 (image), Message 29 (video), Message 30 (image), Message 31 (image), Message 32 (video), Message 33 (video), against the control group Control. Message 2 (video): Video: student-designed message 2 Message 3 (education gap in confidence in science): Text: education gap in confidence in science Message 4 (what science is): Text: what science is Message 5 (video): Video: student-designed message 5 Message 6 (image): Image: student-designed message 6 Message 7 (achievements of scientific progress): Text: achievements of scientific progress Message 8 (video): Video: student-designed message 8 Message 9 (video): Video: student-designed message 9 Message 10 (video): Video: student-designed message 10 Message 11 (news story on a COVID-19 death): Text: news story on a COVID-19 death Message 12 (video): Video: student-designed message 12 Message 13 (image): Image: student-designed message 13 Message 14 (news story on a global-warming study): Text: news story on a global-warming study Message 15 (video): Video: student-designed message 15 Message 16 (video): Video: student-designed message 16 Message 17 (why people question science): Text: why people question science Message 18 (image): Image: student-designed message 18 Message 19 (image): Image: student-designed message 19 Message 20 (video): Video: student-designed message 20 Message 21 (image): Image: student-designed message 21 Message 22 (values exercise): Text: values exercise Message 23 (image): Image: student-designed message 23 Message 24 (image): Image: student-designed message 24 Message 25 (video): Video: student-designed message 25 Message 26 (video): Video: student-designed message 26 Message 27 (image): Image: student-designed message 27 Message 28 (image): Image: student-designed message 28 Message 29 (video): Video: student-designed message 29 Message 30 (image): Image: student-designed message 30 Message 31 (image): Image: student-designed message 31 Message 32 (video): Video: student-designed message 32 Message 33 (video): Video: student-designed message 33 Outcome: Trust in science after treatment.</desc><style>
